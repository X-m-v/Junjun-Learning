<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bel China Bloom Learning - Categories and Academies</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; min-height:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:#8EBB1B; color:#fff; overflow-x:hidden;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
.wrap { max-width:720px; margin:0 auto; min-height:100vh; background:#8EBB1B; padding-bottom:24px; }
.header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 8px; }
.logo { height:52px; width:auto; max-width:150px; object-fit:contain; }
.hd { text-align:center; padding:10px 20px 8px; }
.hd h1 { font-size:21px; font-weight:700; color:#005640; letter-spacing:.3px; line-height:1.3; }
.hd h1 .sub { font-size:15px; font-weight:600; display:block; margin-top:4px; }
.hd p { font-size:13px; color:#005640; margin-top:10px; line-height:1.5; }
.hd .divider { width:60px; height:2px; background:#005640; margin:12px auto 0; border-radius:2px; }

/* top search bar (on every layer) */
.sch { padding:10px 16px 6px; position:relative; }
.sch input {
  width:100%; padding:11px 38px 11px 14px; font-size:14px; background:#004d3a;
  border:1px solid #0a6b52; border-radius:10px; color:#fff; outline:none; -webkit-appearance:none; appearance:none;
}
.sch input::placeholder { color:#B2EC87; }
.sch input:focus { border-color:#B2EC87; }
.sch .cl { position:absolute; right:28px; top:55%; transform:translateY(-50%); font-size:20px; color:#B2EC87; cursor:pointer; display:none; user-select:none; }
.sch.has-text .cl { display:block; }
.sch .cnt { font-size:11px; color:#005640; margin-top:6px; padding-left:2px; }

/* breadcrumb / back bar */
.crumb { display:flex; align-items:center; gap:6px; padding:4px 16px 4px; font-size:12px; color:#005640; flex-wrap:wrap; }
.crumb .bk {
  background:#005640; color:#e0f7d4; border:none; border-radius:8px; padding:6px 12px; font-size:12px;
  cursor:pointer; -webkit-appearance:none; appearance:none; font-weight:600;
}
.crumb .bk:active { opacity:.7; }
.crumb .step { font-weight:600; }
.crumb .sep { opacity:.7; }

/* home keys */
.home { padding:8px 16px; }
.topic-key {
  width:100%; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; margin-top:8px;
  background:#005640; border:none; border-radius:14px; color:#fff; cursor:pointer; -webkit-appearance:none; appearance:none;
}
.topic-key:active { opacity:.8; }
.topic-key .l { text-align:left; }
.topic-key .t { font-size:16px; font-weight:700; }
.topic-key .s { font-size:12px; color:#B2EC87; margin-top:3px; }
.topic-key .r { font-size:16px; color:#B2EC87; }
.sec-title { font-size:12px; font-weight:700; color:#005640; letter-spacing:1px; margin:14px 2px 2px; }
.home-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.home-grid .topic-key { margin-top:0; padding:14px 14px; min-height:84px; flex-direction:column; align-items:flex-start; justify-content:space-between; }
.home-grid .topic-key .t { font-size:13px; line-height:1.35; }
.home-grid .topic-key .s { font-size:11px; }
.home-grid .topic-key .r { font-size:12px; }

/* category list (topics layer 2) */
.cat-list { padding:8px 16px; }
.cat-key {
  width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; margin-top:8px;
  background:#005640; border:none; border-radius:12px; color:#fff; cursor:pointer; text-align:left; -webkit-appearance:none; appearance:none;
}
.cat-key:active { opacity:.8; }
.cat-key .t { font-size:14px; font-weight:600; }
.cat-key .n { font-size:11px; color:#B2EC87; background:#0a6b52; border-radius:999px; padding:2px 9px; margin-left:8px; white-space:nowrap; }
.cat-key .r { font-size:14px; color:#B2EC87; }

/* course list / groups */
.course-view { padding:8px 16px; }
.grp { margin-bottom:8px; border:1px solid #0a6b52; border-radius:12px; overflow:hidden; background:#004d3a; }
.grp-h {
  width:100%; display:flex; align-items:center; gap:8px; padding:12px 14px; cursor:pointer;
  background:#005640; border:none; color:#fff; text-align:left; -webkit-appearance:none; appearance:none;
}
.grp-h .gn { font-size:13px; font-weight:600; flex:1; line-height:1.4; }
.grp-h .gc { font-size:11px; color:#e0f7d4; background:#0a6b52; border-radius:999px; padding:1px 8px; white-space:nowrap; }
.grp-h .ar { font-size:14px; color:#B2EC87; transition:transform .15s; }
.grp.closed .ar { transform:rotate(-90deg); }
.grp-body { padding:6px 10px 10px; }
.grp.closed .grp-body { display:none; }
.crs-item {
  width:100%; display:block; text-align:left; padding:11px 12px; margin-top:6px;
  background:#003b2c; border:1px solid #0a6b52; border-radius:10px; cursor:pointer; color:#fff;
  -webkit-appearance:none; appearance:none; transition:opacity .15s;
}
.crs-item:active { opacity:.6; }
.crs-item .t { font-size:14px; font-weight:500; line-height:1.4; }
.crs-item .no { display:inline-block; font-size:10px; color:#B2EC87; background:#005640; border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:middle; }
.crs-item .h { font-size:11px; color:#8fd470; margin-top:5px; }
.crs-item:hover { border-color:#B2EC87; }
.crs-item:focus-visible, .grp-h:focus-visible, .topic-key:focus-visible, .cat-key:focus-visible, .crumb .bk:focus-visible, .sch input:focus-visible { outline:2px solid #B2EC87; outline-offset:1px; }

/* search result list (home global search) */
.res-list { padding:8px 16px; }

.empty { text-align:center; padding:30px 16px; color:#005640; font-size:14px; }
.footer { text-align:center; padding:24px 16px 8px; font-size:12px; color:#fff; opacity:.92; }

#toast {
  position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:rgba(0,86,64,.94); color:#fff;
  padding:10px 24px; border-radius:8px; font-size:14px; z-index:9999; opacity:0; pointer-events:none; transition:opacity .3s; max-width:88vw;
}
#toast.show { opacity:1; }
#mbox { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:9998; display:none; }
#mbox.show { display:flex; align-items:center; justify-content:center; }
#mbox .mc { background:#004d3a; border:1px solid #B2EC87; border-radius:12px; padding:20px; width:90%; max-width:400px; }
#mbox .mt { font-size:13px; color:#B2EC87; text-align:center; margin-bottom:10px; }
#mbox .ma { width:100%; min-height:80px; padding:10px; font-size:13px; background:#005640; border:1px solid #0a6b52; border-radius:8px; color:#fff; resize:none; outline:none; user-select:text; }
#mbox .mb { display:block; width:100%; margin-top:10px; padding:10px; background:#B2EC87; border:none; border-radius:8px; color:#005640; font-size:14px; font-weight:600; cursor:pointer; }

@media (max-width:420px) {
  .logo { height:44px; }
  .home-grid { grid-template-columns:1fr; }
}
</style>
</head>

}

function renderGroups(groups, withH){
  var body = document.createElement("div"); body.className="course-view";
  groups.forEach(function(g){
    var grp = document.createElement("div"); grp.className="grp";
    var gh = document.createElement("button"); gh.type="button"; gh.className="grp-h";
    gh.setAttribute("aria-expanded","true");
    var gn = document.createElement("span"); gn.className="gn";
    gn.textContent = g.group;
    gh.appendChild(gn);
    if (withH){ var gc = document.createElement("span"); gc.className="gc"; gc.textContent=g.items.length; gh.appendChild(gc); }
    var ar = document.createElement("span"); ar.className="ar"; ar.innerHTML="&#9662;";
    gh.appendChild(ar);
    gh.onclick = function(){ grp.classList.toggle("closed"); gh.setAttribute("aria-expanded", grp.classList.contains("closed") ? "false" : "true"); };
    grp.appendChild(gh);
    var gb = document.createElement("div"); gb.className="grp-body";
    g.items.forEach(function(it){
      var itm = document.createElement("button"); itm.type="button"; itm.className="crs-item";
      var t = document.createElement("span"); t.className="t"; t.textContent=it.t;

      itm.appendChild(hh);
      itm.onclick = function(){ doCopy(it.t); };
      gb.appendChild(itm);
    });
    grp.appendChild(gb);
    body.appendChild(grp);
  });
  return body;
}

  else if (S.view==="topics") renderTopics();
  else if (S.view==="topicCourses") renderTopicCourses();
  else if (S.view==="academy") renderAcademy();
  updateCnt(q, null);
}

function updateCnt(q, shown){
  var c = document.getElementById("cnt");
  if (!q){ c.textContent = "共 " + totalCourses() + " 门课程 / " + DATA.length + " 个分类"; return; }
  if (shown===null){ c.textContent = document.getElementById("view").querySelectorAll(".crs-item:not([disabled])").length + " 门课程"; return; }
  c.textContent = "找到 " + shown + " / " + totalCourses() + " 门课程";
}
function totalCourses(){ var n=0; DATA.forEach(function(sh){ n+=sheetCount(sh); }); return n; }

/* home global search: find courses across layers, jump into the layer on click */
function renderGlobalResults(q){
  var v = document.getElementById("view");
  v.innerHTML = "";
  var list = document.createElement("div"); list.className="res-list";
  var hits = [];
  DATA.forEach(function(sh, si){
    sh.groups.forEach(function(g){
      g.items.forEach(function(it){
        var hay = (it.t + " " + g.group + " " + sh.name).toLowerCase();
        if (hay.indexOf(q) !== -1) hits.push({t: it.t, no: it.no, sh: sh.name, grp: g.group, si: si, cat: g.group});
      });
    });
  });
  if (!hits.length){ v.appendChild(empty("未找到匹配的课程 No courses found")); updateCnt(q, 0); return; }
  /* de-dup by course title (same course may live under different groups) */
  var seen = {}; var uniq = [];
  hits.forEach(function(h){ var key = h.si + "|" + h.t; if (!seen[key]){ seen[key]=1; uniq.push(h); } });
  uniq.slice(0, 200).forEach(function(h){
    var res = document.createElement("div");
    res.className = "grp"; res.style.marginBottom = "8px";
    var gb = document.createElement("div"); gb.className="grp-body"; gb.style.padding="10px";
    var itm = document.createElement("button"); itm.type="button"; itm.className="crs-item"; itm.style.marginTop="0";
    var t = document.createElement("span"); t.className="t"; t.textContent = h.t;
    itm.appendChild(t);
    if (h.no){ var no=document.createElement("span"); no.className="no"; no.textContent=h.no; itm.appendChild(no); }
    var loc = document.createElement("div"); loc.className="h";
    loc.textContent = (h.si===0 ? ("By Topics · " + h.cat) : (h.sh + " · " + h.grp));
    itm.appendChild(loc);
    itm.onclick = function(){
      doCopy(h.t);
      if (h.si===0){ goTopicCourses(h.cat); render(); }
      else { goAcademy(h.si); render(); }
    };
    gb.appendChild(itm);
    res.appendChild(gb);
    list.appendChild(res);
  });
  v.appendChild(list);
  updateCnt(q, uniq.length > 200 ? "200+" : uniq.length);
}

function empty(msg){
  var d = document.createElement("div"); d.className="empty"; d.textContent=msg; return d;
}

function doCopy(text){
  function ok(){ showToast("已复制 Copied: " + trunc(text, 40)); }
  function manual(){ showManual(text); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(function(){ legacy(); });
  } else { legacy(); }
  function legacy(){
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.top="-9999px"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var r = document.execCommand("copy");
      document.body.removeChild(ta);
      if (r) ok(); else manual();
    } catch(e){ manual(); }
  }
}
function showManual(text){
  document.getElementById("mtext").value = text;
  document.getElementById("mbox").className = "show";
  setTimeout(function(){ var ta=document.getElementById("mtext"); ta.focus(); ta.select(); }, 100);
}
function closeMbox(){ document.getElementById("mbox").className = ""; }
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show";
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.className = ""; }, 2000);
}

function onSearch(){
  var q = document.getElementById("q").value;
  var box = document.getElementById("searchbox");
  box.className = q ? "sch has-text" : "sch";
  render();
}
function clearSearch(){ setQ(""); onSearch(); document.getElementById("q").focus(); }

document.getElementById("q").addEventListener("input", onSearch);
/* keyboard: Enter enters first hit layer */
document.getElementById("q").addEventListener("keydown", function(e){
  if (e.key === "Enter" && document.getElementById("view").querySelector(".crs-item")){
    document.getElementById("view").querySelector(".crs-item").click();
  }
});

render();
</script>
</body>
</html>
